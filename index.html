<style>
:root{
  --bg:#edf0f3; --surface:#ffffff; --wk:#f5f7f9; --ink:#15212b; --muted:#5a6773; --line:#d3dae1; --hover:#e8edf1;
  --danger:#b3261e; --ok:#2e7d4f; --warn:#b26a00;
  --c-stay:#8a5a2b; --c-other:#6b7280; --c-teams:#5059c9; --c-boys:#1f6fd6; --c-school:#c77700; --c-special:#b1307c; --c-holiday:#0b7a99; --c-travel:#5546c8; --c-appt:#b8551a; --c-work:#2f5d86; --c-chore:#2c7a4b; --c-action:#3b4652; --c-social:#8e44ad;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#11161b; --surface:#1a2129; --wk:#171d24; --ink:#e7ecf0; --muted:#94a1ad; --line:#2d3740; --hover:#242e37;
    --danger:#ff8a80; --ok:#7ad39c; --warn:#f0b85a;
    --c-stay:#d9a56b; --c-other:#9aa1ac; --c-teams:#a7abf5; --c-boys:#7db4ff; --c-school:#ffc247; --c-special:#f08ac4; --c-holiday:#6cc4e0; --c-travel:#a79cff; --c-appt:#f0a070; --c-work:#8fbbe6; --c-chore:#7fd3a0; --c-action:#b7c2cc; --c-social:#cf9de6;
  }
}
.dt-holiday{--dt:#c0392b;--dt-t:#f9dedb;--dt-ink:#8c1f14}
.dt-onsite{--dt:#2b6cb0;--dt-t:#dce9f7;--dt-ink:#1b4a80}
.dt-offsite{--dt:#178a86;--dt-t:#d6efed;--dt-ink:#0d5e5a}
.dt-annual{--dt:#c48a12;--dt-t:#fbeec9;--dt-ink:#775006}
.dt-sick{--dt:#7c4fbf;--dt-t:#eadff7;--dt-ink:#54308e}
.dt-rdo{--dt:#5f8a2e;--dt-t:#e3efd2;--dt-ink:#3b5c17}
@media (prefers-color-scheme:dark){
  .dt-holiday{--dt:#e5685a;--dt-t:#3e1f1c;--dt-ink:#f5b1a8}
  .dt-onsite{--dt:#5b9be0;--dt-t:#172f4a;--dt-ink:#a6cbf3}
  .dt-offsite{--dt:#3fb8b3;--dt-t:#12363a;--dt-ink:#8ad9d5}
  .dt-annual{--dt:#e0ac3a;--dt-t:#3f3013;--dt-ink:#f2d08e}
  .dt-sick{--dt:#a884e0;--dt-t:#2e2247;--dt-ink:#d3bdf5}
  .dt-rdo{--dt:#8dbb55;--dt-t:#263717;--dt-ink:#bfe092}
}
.k-stay{--k:var(--c-stay)} .k-other{--k:var(--c-other)} .k-special{--k:var(--c-special)} .k-holiday{--k:var(--c-holiday)} .k-travel{--k:var(--c-travel)} .k-appt{--k:var(--c-appt)}
.k-work{--k:var(--c-work)} .k-chore{--k:var(--c-chore)} .k-action{--k:var(--c-action)} .k-social{--k:var(--c-social)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;padding:14px 16px 40px}

/* top bar */
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav,.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ttl{display:flex;align-items:center;gap:6px}
.ttl select,.ttl input{font:inherit;font-size:22px;font-weight:650;letter-spacing:-.01em;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:8px;padding:2px 6px;cursor:pointer}
.ttl select:hover,.ttl input:hover{background:var(--hover)}
.ttl input{width:5.2ch;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.ttl input::-webkit-outer-spin-button,.ttl input::-webkit-inner-spin-button{display:none}
.btn{font-size:13.5px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.btn:hover{background:var(--hover)}
a.btn{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.maplink{display:inline-flex;align-items:center;gap:3px;color:var(--ink);text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
.maplink svg{width:12px;height:12px;flex:none}
.teamslink svg{color:var(--c-teams)}
a.btn.maplink{text-decoration:none}
a.btn.maplink svg{width:14px;height:14px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.primary:hover{opacity:.88}
.btn.danger{color:var(--danger)}
.iconbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:20px;line-height:1;display:grid;place-items:center}
.iconbtn:hover{background:var(--hover)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font-size:13.5px}
.seg button.on{background:var(--ink);color:var(--surface)}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;cursor:pointer;max-width:260px}
.pill:hover{background:var(--hover)}
.pill .sd{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.pill.ok .sd{background:var(--ok)} .pill.warn .sd{background:var(--warn)} .pill.bad .sd{background:var(--danger)}
.pill svg{width:13px;height:13px;flex:none}
.btn svg{width:14px;height:14px;vertical-align:-2.5px;margin-right:5px;flex:none}
.pill span.tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:20;min-width:190px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.menu[hidden]{display:none}
.menu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:7px;cursor:pointer}
.menu button:hover{background:var(--hover)}
.menu svg{width:15px;height:15px;color:var(--k)}

/* legend / paint */
.legend{display:flex;flex-direction:column;gap:8px;margin:0 0 12px}
.lgrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.lgt{font-size:12.5px;color:var(--muted);margin-right:2px;min-width:78px}
.dtbtn{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:12.5px}
.dtbtn i{width:11px;height:11px;border-radius:3px;background:var(--dt,transparent);border:1px solid var(--dt,var(--muted))}
.dtbtn:hover{background:var(--hover)}
.dtbtn.on{background:var(--dt-t,var(--hover));border-color:var(--dt,var(--ink));color:var(--dt-ink,var(--ink));font-weight:600}
.dtbtn.eraser.on{border-color:var(--ink);font-weight:600}
.mk-boys{--mk:var(--c-boys)} .mk-school{--mk:var(--c-school)}
.mkbtn svg{width:17px;height:17px;color:var(--mk);flex:none}
.dtbtn.mkbtn.on{background:color-mix(in srgb,var(--mk) 14%,var(--surface));border-color:var(--mk);font-weight:600}
.hint{font-size:12.5px;color:var(--muted);margin-left:6px}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;cursor:pointer;font-size:12.5px}

/* layout */
.main{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}
@media (max-width:1000px){.main{grid-template-columns:1fr}}

/* month grid */
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{padding:4px 8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.grid{gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;user-select:none;-webkit-user-select:none}
.grid.painting{cursor:crosshair;touch-action:none}
.day{background:var(--surface);min-height:118px;padding:6px 6px 5px;display:flex;flex-direction:column;gap:4px;cursor:pointer;position:relative;min-width:0}
.day.weekend{background:var(--wk)}
.day[class*="dt-"]{background:var(--dt-t);box-shadow:inset 0 4px 0 var(--dt)}
.day.other{opacity:.55}
.day.selected{outline:2px solid var(--ink);outline-offset:-2px;z-index:1}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:6px;min-height:20px}
.num{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;padding:1px 6px;border-radius:999px}
.today .num{background:var(--ink);color:var(--surface)}
.dn{display:inline-flex;align-items:center;gap:5px;min-width:0}
.bi{display:inline-flex;color:var(--c-boys)}
.bi-school{color:var(--c-school)}
.bi svg{width:19px;height:19px;display:block}
.fd .bi svg{width:21px;height:21px}
.dtl{font-size:11.5px;font-weight:650;color:var(--dt-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-direction:column;gap:2px;min-width:0}
.chip{display:flex;align-items:center;gap:4px;font-size:11.5px;line-height:1.3;padding:2px 5px;border-radius:4px;border-left:3px solid var(--k);background:color-mix(in srgb,var(--k) 13%,var(--surface));min-width:0;white-space:nowrap}
.chip svg{width:11px;height:11px;flex:none;color:var(--k)}
.chip .t{font-weight:650;font-variant-numeric:tabular-nums;flex:none}
.chip .tx{overflow:hidden;text-overflow:ellipsis}
.chip.done .tx{text-decoration:line-through;opacity:.6}
.chip.late{--k:var(--danger)}
.abul{width:7px;height:7px;border-radius:50%;background:var(--c-action);flex:none;margin-top:5px}
.abul.late{background:var(--danger)}
.chip.act{border-left:0;background:transparent;padding:1px 3px;gap:6px}
.chip.act .abul{margin-top:0}
.chip.act.late .tx{color:var(--danger)}
.row.act{border-left:0;background:transparent;padding:3px 6px;margin-bottom:1px;cursor:default;gap:8px}
.row.act:hover{background:transparent}
.row.act .abul{margin-top:6px}
.row.act.late .ti{color:var(--danger)}
.dot.sq{border-radius:2px}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.thumb{height:64px;max-width:150px;object-fit:cover;border-radius:5px;border:1px solid var(--line);cursor:zoom-in;background:#fff}
.imgbox{border:1.5px dashed var(--line);border-radius:8px;padding:12px;text-align:center;font-size:13px;color:var(--muted);background:var(--bg);cursor:text;outline-offset:2px}
.imgbox:focus,.imgbox.over{border-color:var(--ink);color:var(--ink)}
.th{position:relative;display:inline-block}
.th img{height:72px;max-width:160px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block;background:#fff}
.th button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:13px;line-height:1;padding:0}
.prow{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .ico{width:16px;height:16px;flex:none;color:var(--muted)}
.prow .ico svg{width:16px;height:16px;display:block}
.prow .rb{flex:1;min-width:0}
.prowbtns{display:flex;gap:6px;flex:none}
.prowbtns .btn{padding:5px 10px;font-size:12.5px}
dialog#phoneDlg{width:min(480px,94vw)}
dialog.imgdlg{width:auto;max-width:96vw;background:transparent;border:0;padding:0}
dialog.imgdlg img{display:block;max-width:94vw;max-height:88vh;border-radius:8px;background:#fff;cursor:zoom-out}
.chip.more{border-left-color:transparent;background:transparent;color:var(--muted);padding-left:2px}
.dots{display:none;flex-wrap:wrap;gap:3px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--k)}
.dotn{font-size:10.5px;font-weight:700;color:var(--c-action)}
.dotn.late{color:var(--danger)}
@media (max-width:760px){
  #phoneBtn{display:none}
  .wrap{padding:10px 8px 30px}
  .chips{display:none} .dots{display:flex}
  .day{min-height:64px;padding:4px}
  .dtl{display:none}
  .dow div{padding:4px 2px;text-align:center}
  .ttl select{font-size:19px}.ttl input{font-size:19px}
}

/* two-week view: one row per week, Mon-Fri boxes plus a stacked Sat/Sun column */
.rangelbl{font-size:13.5px;color:var(--muted);margin-left:4px}
.main.wide{grid-template-columns:1fr}
.panel[hidden]{display:none}
.fdow,.twgrid{grid-template-columns:repeat(6,minmax(0,1fr))}
.fwrap{display:flex;flex-direction:column;gap:6px}
.fwl{font-size:12.5px;font-weight:600;color:var(--muted);margin:6px 0 0}
.fwl:first-child{margin-top:0}
.twgrid{grid-auto-rows:minmax(330px,auto)}
.wkend{display:grid;grid-template-rows:1fr 1fr;gap:1px;background:var(--line);min-width:0}
.day.fd{min-height:0;padding:8px 8px 6px;gap:6px}
.wkend .day.fd{min-height:160px}
.fd .dh{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:center;min-height:24px}
.fd .num{font-size:13.5px}
.fd .dtl{display:block;text-align:right;font-size:12px}
.fdn{display:none}
.wkend .fdn{display:inline}
.fdadd{width:24px;height:24px;border-radius:6px;border:1px solid transparent;background:transparent;cursor:pointer;font-size:17px;line-height:1;color:var(--muted);display:grid;place-items:center;padding:0}
.fdadd:hover{background:var(--hover);border-color:var(--line);color:var(--ink)}
.fnote{font-size:12px;color:var(--dt-ink,var(--muted));font-weight:600}
.fbody{display:flex;flex-direction:column;min-width:0}
.fd .row{padding:5px 6px;margin-bottom:4px;gap:6px;font-size:12.5px}
.fd .row .ico{width:13px;height:13px;margin-top:3px}
.fd .row .ico svg{width:13px;height:13px}
.fd .r2{font-size:11.5px;gap:0 10px}
.r2.col{flex-direction:column;gap:0}
.day.fd.past{opacity:.72}
@media (max-width:1000px){
  .twgrid{grid-template-columns:1fr;grid-auto-rows:auto}
  .wkend{display:contents}
  .wkend .day.fd{min-height:0}
  .fdow{display:none}
  .fdn{display:inline}
}

/* side panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 16px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
@media (max-width:1000px){.panel{position:static;max-height:none}}
.pd{font-size:18px;font-weight:650;letter-spacing:-.01em}
.pdh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pdh .bi svg{width:24px;height:24px}
.agh{justify-content:flex-start!important}
.agh .dtl{margin-left:auto}
.tag{display:inline-block;margin-left:8px;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--ink);color:var(--surface);vertical-align:2px}
.sec{margin-top:14px}
.lab{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.dtset{display:flex;flex-wrap:wrap;gap:6px}
.note{width:100%;margin-top:8px;font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px}
.addrow{display:flex;flex-wrap:wrap;gap:6px}
.fchks{display:flex;flex-wrap:wrap;gap:7px 14px}
.fchk{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none}
.fchk input{width:16px;height:16px;margin:0;accent-color:var(--k,var(--ink));cursor:pointer}
.fchk svg{width:13px;height:13px;color:var(--k);flex:none}
.lab .linkbtn{margin-left:8px;font-weight:400}
.addrow .btn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;font-size:13px}
.addrow svg{width:13px;height:13px;color:var(--k)}
.grp{font-size:12.5px;font-weight:650;color:var(--muted);margin:14px 0 5px}
.row{display:flex;gap:9px;align-items:flex-start;padding:8px 9px;margin-bottom:5px;border-radius:8px;border-left:3px solid var(--k);background:color-mix(in srgb,var(--k) 9%,var(--surface));cursor:pointer}
.row:hover{background:color-mix(in srgb,var(--k) 16%,var(--surface))}
.row .ico{width:16px;height:16px;flex:none;margin-top:2px;color:var(--k)}
.row .ico svg{width:16px;height:16px;display:block}
.row.static{cursor:default}
.row.static:hover{background:color-mix(in srgb,var(--k) 9%,var(--surface))}
.row.late{--k:var(--danger)}
.chk{width:16px;height:16px;margin:2px 0 0;accent-color:var(--c-chore);flex:none;cursor:pointer}
.rb{min-width:0;flex:1}
.r1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.r1 .t{font-weight:650;font-variant-numeric:tabular-nums}
.r1 .ti{font-weight:500}
.done .ti{text-decoration:line-through;opacity:.6}
.r2{display:flex;flex-wrap:wrap;gap:1px 12px;font-size:12.5px;color:var(--muted);margin-top:1px}
.r2 a{color:var(--ink)}
.empty{color:var(--muted);font-size:13px;margin:6px 0}

/* agenda */
.agenda{display:flex;flex-direction:column;gap:12px}
.ag{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px 6px}
.ag.selected{outline:2px solid var(--ink);outline-offset:-2px}
.ag[class*="dt-"]{border-left:5px solid var(--dt)}
.agh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;cursor:pointer;margin-bottom:4px}
.agh b{font-size:14px}
.agh .dtl{font-size:12px}
.ag .grp:first-of-type{margin-top:6px}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(640px,94vw)}
dialog::backdrop{background:rgba(10,14,18,.5)}
.dhead{padding:16px 18px 6px;font-size:17px;font-weight:650;display:flex;align-items:center;justify-content:space-between;gap:8px}
.dbody{padding:6px 18px 14px;max-height:68vh;overflow:auto}
.dfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.dfoot .sp{flex:1}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.f.wide{grid-column:1/-1}
.f input,.f select,.f textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0;width:100%}
.f.chkf{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.f.chkf input{width:auto}
.wds{display:flex;gap:5px;flex-wrap:wrap}
.wd{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:5px 9px;cursor:pointer;font-size:13px}
.wd.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.skb{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:5px 9px;cursor:pointer;font-size:13px}
.skb:hover{background:var(--hover)}
.ageinfo{font-size:14px;color:var(--ink);padding:2px 0}
.err{color:var(--danger);font-size:13px;margin-top:8px;min-height:1em}
.sep{border:0;border-top:1px solid var(--line);margin:14px 0 6px;grid-column:1/-1}
.dbody h3{font-size:14px;margin:16px 0 4px}
.dbody h3:first-child{margin-top:4px}
.mut{color:var(--muted);font-size:13px;margin:3px 0 8px}
.stat{margin:6px 0}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.mapgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
@media (max-width:520px){.mapgrid{grid-template-columns:1fr}}
.tkstat{border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:center}
.tkstat b{font-size:18px}
.tklist{display:flex;flex-direction:column;gap:4px;max-height:200px;overflow:auto;margin:8px 0}
.tkrow{display:flex;align-items:center;justify-content:space-between;padding:5px 9px;border:1px solid var(--line);border-radius:6px;font-size:13px}
.tkdate{display:flex;align-items:center;gap:6px}
.tkdate input{font:inherit;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.pickhidden{cursor:default}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:9px;font-size:13.5px;z-index:50;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<body>
<div class="wrap">
  <header class="top">
    <div class="nav">
      <button class="iconbtn" data-act="prev" aria-label="Previous month">&#8249;</button>
      <div class="ttl"><select id="selMonth" aria-label="Month"></select><input id="selYear" type="number" min="1970" max="2100" aria-label="Year"></div>
      <button class="iconbtn" data-act="next" aria-label="Next month">&#8250;</button>
      <button class="btn" data-act="today">Today</button>
      <span class="rangelbl" id="rangeLbl" hidden></span>
    </div>
    <div class="tools">
      <button class="btn" id="pdfBtn" data-act="pdf" hidden title="Opens your browser's print window: choose Save as PDF">Save as PDF</button>
      <button class="btn" id="outlookBtn" data-act="outlook" hidden title="Print a simplified, colour-coded 13-week outlook (fits one A4 page)">13-Week Report</button>
      <a class="btn" id="diaryLink" href="#" target="_blank" rel="noopener" hidden title="Open your diary in a new tab"></a>
      <button class="pill" id="actPill" data-act="actpill" hidden></button>
      <button class="btn" id="phoneBtn" data-act="phone" title="Rebuild the phone calendar feed now (needs the one-time Install-FeedButton setup on this PC)"></button>
      <button class="pill" id="phoneAddPill" data-act="phoneadd" hidden></button>
      <button class="pill" id="statusPill" data-act="data"></button>
      <div class="seg" role="group" aria-label="View">
        <button data-act="view" data-v="month">Month</button>
        <button data-act="view" data-v="fortnight">2 weeks</button>
        <button data-act="view" data-v="agenda">Agenda</button>
      </div>
      <div class="addwrap">
        <button class="btn primary" data-act="addmenu">+ Add</button>
        <div id="addmenu" class="menu" hidden></div>
      </div>
    </div>
  </header>
  <section class="legend" id="legend"></section>
  <main class="main">
    <section id="cal"></section>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>
</div>
<dialog id="editor"></dialog>
<dialog id="dataDlg"></dialog>
<dialog id="choiceDlg"></dialog>
<dialog id="imgDlg" class="imgdlg"></dialog>
<dialog id="phoneDlg"></dialog>
<dialog id="trackDlg"></dialog>

<script>

/* =====================================================================

/* ---------- constants ---------- */
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const DAYTYPES=[
  {key:'holiday',label:'Public holiday',short:'PH'},

  {key:'annual',label:'Annual leave',short:'Annual leave'},
  {key:'sick',label:'Sick leave',short:'Sick leave'},
  {key:'rdo',label:'RDO',short:'RDO'},
];
const DTMAP=Object.fromEntries(DAYTYPES.map(d=>[d.key,d]));
function dayType(ds){const k=data.dayTypes[ds];return(k&&DTMAP[k])?k:'';}   // guards against a day-type key saved by a different copy of this file whose colour list included it
const TYPES={
  special:{label:'Special event',plural:'Special events',icon:'star',order:1},
  holiday:{label:'Holiday',plural:'Holidays',icon:'sun',order:2},
  travel:{label:'Travel',plural:'Travel',icon:'plane',order:3},
  stay:{label:'Accommodation',plural:'Accommodation',icon:'bed',order:3.5},
  appt:{label:'Appointment',plural:'Appointments',icon:'clock',order:4},
  social:{label:'Social event',plural:'Social events',icon:'users',order:4.5},
  work:{label:'Work event',plural:'Work events',icon:'briefcase',order:5},
  chore:{label:'Chore',plural:'Chores',icon:'check',order:6},
  other:{label:'Other',plural:'Other',icon:'other',order:7},
};
const ICONS={
  plane:'<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.2.4c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',
  train:'<path d="M8 3.1V7a4 4 0 0 0 8 0V3.1"/><path d="m9 15-1-1"/><path d="m15 15 1-1"/><path d="M9 19c-2.8 0-5-2.2-5-5v-4a8 8 0 0 1 16 0v4c0 2.8-2.2 5-5 5Z"/><path d="m8 19-2 3"/><path d="m16 19 2 3"/>',
  bus:'<path d="M8 6v6"/><path d="M15 6v6"/><path d="M2 12h19.6"/><path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/>',
  car:'<path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/>',
  ship:'<path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.9.94 5.34 2.81 7.76"/><path d="M19 13V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6"/><path d="M12 10v4"/><path d="M12 2v3"/>',
  nav:'<polygon points="3 11 22 2 13 21 11 13 3 11"/>',
  bed:'<path d="M2 20V5"/><path d="M2 16h20v4"/><path d="M22 16v-3a3 3 0 0 0-3-3h-8v6"/><circle cx="6.5" cy="12" r="2"/>',
  other:'<rect x="4" y="3" width="16" height="18" rx="2" ry="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="12" y2="16"/>',
  video:'<polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>',
  phone:'<rect x="7" y="2" width="10" height="20" rx="2" ry="2"/><line x1="11" y1="18" x2="13" y2="18"/>',
  upload:'<path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 21h16"/>',
  pin:'<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
  cal:'<rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',

  star:'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
  clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',

  check:'<path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/><polyline points="9 11 12 14 22 4"/>',
  action:'<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  book:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',

const FILLED={
  boys:'<circle cx="8" cy="6.2" r="2.7"/><path d="M3.6 20.5v-6.2a4.4 4.4 0 0 1 8.8 0v6.2z"/><circle cx="17" cy="9.6" r="2.3"/><path d="M13.2 20.5v-4.1a3.8 3.8 0 0 1 7.6 0v4.1z"/>',
};
// day markers: click days to mark them; the icon shows beside the date number
const MARKERS={
  boys:{label:'Boys at home',field:'boysDays',icon:'boys',hint:'the boys are at home'},
  school:{label:'School holidays',field:'schoolDays',icon:'cal',hint:'are school holidays'},
};
const markIcon=k=>`<span class="bi bi-${k}" data-mk="${k}" title="${MARKERS[k].label}" role="img" aria-label="${MARKERS[k].label}">${icon(MARKERS[k].icon)}</span>`;
const markIcons=ds=>Object.keys(MARKERS).filter(k=>data[MARKERS[k].field]&&data[MARKERS[k].field][ds]).map(markIcon).join('');
const hasMark=ds=>Object.values(MARKERS).some(m=>data[m.field]&&data[m.field][ds]);
const icon=n=>FILLED[n]
  ?`<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${FILLED[n]}</svg>`
  :`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
const isWebLink=t=>/^https?:\/\//i.test(String(t||'').trim());
const mapUrl=loc=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(String(loc).trim());
const isTeams=t=>/^https?:\/\/([\w-]+\.)*(teams\.microsoft\.com|teams\.live\.com)(\/|$)/i.test(String(t||'').trim());
const teamsBit=url=>`<a class="maplink teamslink" href="${esc(String(url).trim())}" target="_blank" rel="noopener" data-nolink title="Join the Teams meeting">${icon('video')}Join Teams</a>`;
const locBit=it=>{
  const l=String(it.location||'').trim(); if(!l) return '';

function occursOn(it,ds){
  const start=it.date; if(!start) return false;
  const r=it.repeat||'none', dn=dayNum(ds), sn=dayNum(start);
  if(dn<sn) return false;
  if(it.skip&&it.skip.includes(ds)) return false;
  if(r==='none'){const end=it.endDate?dayNum(it.endDate):sn;return dn<=Math.max(end,sn);}
  if(it.until&&dn>dayNum(it.until)) return false;
  const n=Math.max(1,+it.interval||1);
  if(r==='day') return (dn-sn)%n===0;
  if(r==='week'){
    const days=it.weekdays&&it.weekdays.length?it.weekdays:[weekday(start)];
    if(!days.includes(weekday(ds))) return false;
    const wk=((dn-weekday(ds))-(sn-weekday(start)))/7;
    return wk%n===0;
  }
  const a=parse(start), b=parse(ds);
  if(r==='month'){
    const months=(b.y-a.y)*12+(b.m-a.m);
    if(months<0||months%n) return false;
    return b.d===Math.min(a.d,daysInMonth(b.y,b.m));
  }
  if(r==='year'){
    if((b.y-a.y)%n||a.m!==b.m) return false;
    return b.d===Math.min(a.d,daysInMonth(b.y,b.m));
  }
  return false;
}
function itemsForDay(ds){

      if(ds===dd&&ds===ad) out.push({it,kind:'both',time:it.departTime||''});
      else if(ds===dd) out.push({it,kind:'depart',time:it.departTime||''});
      else if(ds===ad) out.push({it,kind:'arrive',time:it.arriveTime||''});
      else if(dayNum(ds)>dayNum(dd)&&dayNum(ds)<dayNum(ad)) out.push({it,kind:'between',time:'~'});
    }else if(it.type==='stay'){
      const ci=it.checkInDate, co=it.checkOutDate||it.checkInDate; if(!ci) continue;
      if(ds===ci&&ds===co) out.push({it,kind:'both',time:it.checkInTime||''});

      else if(ds===co) out.push({it,kind:'out',time:it.checkOutTime||''});
      else if(dayNum(ds)>dayNum(ci)&&dayNum(ds)<dayNum(co)) out.push({it,kind:'between',time:'~'});
    }else if(occursOn(it,ds)){

    const r=await fetch(uploadUrl,{method:'PUT',headers:{'Content-Length':String(part.length),'Content-Range':`bytes ${start}-${end-1}/${bytes.length}`},body:part});

/* ---------- action tracker integration ---------- */
function parseAnyDate(v){
  if(v==null||v==='') return null;
  if(typeof v==='number'){const d=new Date(v>1e11?v:v*1000);return isNaN(d)?null:toStr(d);}
  const s=String(v).trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return fmtDate(+m[1],+m[2],+m[3]);
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))){const y=+m[3]<100?2000+ +m[3]:+m[3];return fmtDate(y,+m[2],+m[1]);} // day-first (AU)
  const d=new Date(s); return isNaN(d)?null:toStr(d);
}
function parseCSV(t){
  const rows=[]; let row=[],cur='',q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"') q=true;
    else if(c===','){row.push(cur);cur='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x!==''))rows.push(row);row=[];}
    else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);if(row.some(x=>x!==''))rows.push(row);}
  const head=(rows.shift()||[]).map(h=>h.trim());
  return rows.map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]??''])));
}
function findRows(o,d=0){
  if(Array.isArray(o)) return (o.length&&o[0]&&typeof o[0]==='object'&&!Array.isArray(o[0]))?o:null;
  if(o&&typeof o==='object'&&d<3){
    const keys=Object.keys(o), pref=keys.filter(k=>/action|task|item|data|rows/i.test(k));
    for(const k of [...pref,...keys.filter(k=>!pref.includes(k))]){const r=findRows(o[k],d+1);if(r) return r;}
  }
  return null;
}
function mapActions(rows,cfg){
  const keys=[...new Set(rows.slice(0,100).flatMap(r=>Object.keys(r)))];
  const has=k=>k&&keys.includes(k);
  const due=has(cfg.dueField)?cfg.dueField:(keys.find(k=>/^(due|due[_ ]?date|duedate|deadline|due[_ ]?on|target[_ ]?date|date[_ ]?due)$/i.test(k))||keys.find(k=>/due|deadline/i.test(k)));
  if(!due) throw new Error('Could not find a due-date field. Set it under Data, Action tracker.');
  const title=has(cfg.titleField)?cfg.titleField:(keys.find(k=>/^(action|title|description|task|name|summary|action[_ ]?description)$/i.test(k))||keys.find(k=>k!==due&&/action|desc|title|task|name/i.test(k)));
  const status=has(cfg.statusField)?cfg.statusField:keys.find(k=>/^(status|state|closed|complete|completed|done|is[_ ]?closed|is[_ ]?complete|is[_ ]?done)$/i.test(k));
  const closedDateKey=keys.find(k=>/^(closed|completed?)[_ ]?(date|at|on)$/i.test(k));
  const isClosed=r=>{
    if(closedDateKey&&r[closedDateKey]) return true;
    if(!status) return false;
    const v=r[status];
    if(typeof v==='boolean') return /closed|complete|done/i.test(status)?v:false;
    if(typeof v==='number') return /closed|complete|done/i.test(status)?v===1:false;
    return /^(closed|complete|completed|done|cancelled|canceled|resolved|yes|true|y|1)$/i.test(String(v??'').trim());
  };
  const list=[];
  for(const r of rows){const d=parseAnyDate(r[due]);if(!d) continue;list.push({due:d,title:String(title?r[title]:'(action)').slice(0,200),open:!isClosed(r)});}
  return{list,det:{due,title:title||'',status:status||closedDateKey||''}};
}
function rebuildActionIndex(){

async function ingestActions(text,name,{silent=false}={}){
  let rows;
  try{
    const looksJson=/^\s*[\[{]/.test(text)&&!/\.csv$/i.test(name);
    if(looksJson){const j=JSON.parse(text);rows=findRows(j)||(j&&typeof j==='object'&&!Array.isArray(j)?Object.values(j).filter(v=>v&&typeof v==='object'&&!Array.isArray(v)):null);}
    else rows=parseCSV(text);
  }catch(e){throw new Error('Could not read that file as JSON or CSV.');}
  if(!rows||!rows.length) throw new Error('No action rows were found in that file.');
  const {list,det}=mapActions(rows,data.settings.actions);
  lastActionsText=text;
  actionsState={linked:true,fileName:name,list,det,needsPerm:false,error:'',
    info:`${name}: ${plural(list.length,'action')} read, ${list.filter(a=>a.open).length} open. Due date: "${det.due}", title: "${det.title||'none'}", status: "${det.status||'none'}".`};
  rebuildActionIndex();
  try{localStorage.setItem(LS_ACT,JSON.stringify({fileName:name,list,det,at:Date.now()}));}catch(e){}
  if(!silent) toast(`Read ${plural(list.length,'action')} from ${name}`);
  render(); renderData();
}

function fortnightHtml(pr){

  let h=`<div class="dow fdow">${['Mon','Tue','Wed','Thu','Fri','Sat / Sun'].map(d=>`<div>${d}</div>`).join('')}</div><div class="fwrap">`;
  for(let w=0;w<2;w++){

    h+=`<div class="fwl">Week of ${shortDate(fromDayNum(ws))}</div><div class="grid twgrid ${paint&&!pr?'painting':''}">${g}</div>`;
  }

}

  return true;

function sexStats(){
  const dates=data.sexLog.map(x=>x.date).slice().sort();
  const n=dates.length, t=todayStr(), tDn=dayNum(t), thisMonthKey=t.slice(0,7);
  const last30=dates.filter(d=>dayNum(d)>=tDn-29).length;
  const last365=dates.filter(d=>dayNum(d)>=tDn-364).length;
  const thisMonth=dates.filter(d=>d.slice(0,7)===thisMonthKey).length;
  const gaps=[]; for(let i=1;i<dates.length;i++) gaps.push(dayNum(dates[i])-dayNum(dates[i-1]));
  const avgGap=gaps.length?Math.round((gaps.reduce((a,b)=>a+b,0)/gaps.length)*10)/10:null;
  return {n,last30,last365,thisMonth,avgGap,last:n?dates[n-1]:null};
}
function cycleLenPairs(starts){const out=[];for(let i=1;i<starts.length;i++)out.push(dayNum(starts[i])-dayNum(starts[i-1]));return out;}
function periodStats(){
  const starts=data.periods.map(p=>p.start).slice().sort();

  const avg12=last12Lens.length?Math.round(last12Lens.reduce((a,b)=>a+b,0)/last12Lens.length):null;

}

  const sk=e.target.closest('.skb'); if(sk){editSkip=editSkip.filter(x=>x!==sk.dataset.skipdate);sk.remove();if(!editSkip.length)$('#w_skip').hidden=true;return;}
  if(e.target.closest('[data-nolink]')) return;
  const dlg=e.target; if(dlg.id==='dataDlg'){dlg.close();return;}
  if(dlg.id==='trackDlg'){dlg.close();return;}
  const el=e.target.closest('[data-act]');
  if(!el){
    const cell=e.target.closest('.day');
    if(cell&&!paint){selected=cell.dataset.date;render();if(matchMedia('(max-width:1000px)').matches)$('#panel').scrollIntoView({behavior:'smooth',block:'start'});}
    return;
  }
  const act=el.dataset.act;
  switch(act){
    case 'prev':shiftPeriod(-1);break;
    case 'next':shiftPeriod(1);break;
    case 'today':goToDate(todayStr());render();break;
    case 'view':setMode(el.dataset.v);break;
    case 'addto':{
      selected=el.dataset.date; const keys=Object.keys(TYPES);
      const c=await askChoice('Add to '+shortDate(selected),'',[...keys.map(k=>TYPES[k].label),'Cancel'],false);
      if(c>=0&&c<keys.length) openEditor(keys[c],null,selected); else render();
      break;
    }
    case 'addmenu':$('#addmenu').hidden=!$('#addmenu').hidden;break;
    case 'add':$('#addmenu').hidden=true;openEditor(el.dataset.type,null,selected);break;
    case 'edit':openEditor(null,el.dataset.id,el.dataset.date);break;
    case 'skip':skipOccurrence();break;
    case 'toggle':{const k=el.dataset.id+'|'+el.dataset.date;if(el.checked)data.done[k]=true;else delete data.done[k];commit();render();break;}
    case 'paint':{const k=el.dataset.key;paint=(k==='off'||paint===k)?null:k;render();break;}
    case 'setdt':{const k=el.dataset.key;setDayType(selected,data.dayTypes[selected]===k?'clear':k);commit();render();break;}
    case 'select':selected=el.dataset.date;render();break;
    case 'phoneadd':renderPhoneDlg();$('#phoneDlg').showModal();break;
    case 'phoneadd-add':{
      const it=phonePending.find(x=>x.id===el.dataset.id); if(!it) break;
      $('#phoneDlg').close();
      const seed={title:it.title||''}; if(it.location)seed.location=it.location; if(it.notes)seed.notes=it.notes;
      if((it.type==='appt'||it.type==='work')&&it.time) seed.startTime=it.time;
      pendingImportId=it.id;
      openEditor(it.type,null,it.date||todayStr(),seed);
      break;
    }
    case 'phoneadd-skip':markPhoneImported(el.dataset.id);renderPhoneDlg();break;
    case 'phoneadd-check':refreshPhoneQueue().then(()=>toast(`${plural(phonePending.length,'item')} waiting`));break;
    case 'phoneadd-save':{
      const v=$('#phoneQueueId').value.trim(); if(!v){toast('Paste the queue ID first');break;}
      data.settings.phoneQueue={id:v,imported:(data.settings.phoneQueue&&data.settings.phoneQueue.imported)||[]};
      commit(); renderData(); refreshPhoneQueue(); toast('Saved');
      break;
    }
    case 'phoneadd-unlink':data.settings.phoneQueue={id:'',imported:[]};commit();renderData();phonePending=[];renderPhoneAddPill();break;
    case 'viewimg':{const it=data.items.find(i=>i.id===el.dataset.id);const im=it&&it.images&&it.images[+el.dataset.idx];if(im)showImage(im.data);break;}
    case 'viewimg-edit':{const im=editImages[+el.dataset.idx];if(im)showImage(im.data);break;}
    case 'rmimg':editImages.splice(+el.dataset.idx,1);renderEditImages();break;
    case 'addimg':$('#imgFile').click();break;
    case 'pdf':printFortnight();break;
    case 'outlook':printOutlook();break;
    case 'phone':updatePhone();break;
    case 'filters-all':filters={};saveFilters();render();break;
    case 'setmark':{const f=data[MARKERS[el.dataset.key].field];if(f[selected])delete f[selected];else f[selected]=true;commit();render();break;}
    case 'data':statusInfo.state==='signedout'?signIn():openData();break;
    case 'actpill':openData();break;
    case 'cancel':$('#editor').close();pendingImportId=null;break;
    case 'save':saveEditor();break;
    case 'delete':deleteItem();break;
    case 'close-data':$('#dataDlg').close();break;
    case 'track':openTrack();break;
    case 'close-track':$('#trackDlg').close();break;
    case 'track-tab':trackTab=el.dataset.tab;renderTrack();break;
    case 'track-method':setPredictMethod(el.dataset.m);break;
    case 'track-log-sex-today':logSex(todayStr());break;
    case 'track-log-sex-date':{const v=dateInputVal('#trackSexDate');if(!v){toast('Pick a date first');break;}logSex(v);break;}
    case 'track-del-sex':removeSex(el.dataset.id);break;
    case 'track-log-period-today':logPeriod(todayStr());break;
    case 'track-log-period-date':{const v=dateInputVal('#trackPeriodDate');if(!v){toast('Pick a date first');break;}logPeriod(v);break;}
    case 'track-del-period':removePeriod(el.dataset.id);break;
    case 'msal-signin':signIn();break;
    case 'msal-signout':signOut();break;
    case 'export':exportJson();break;
    case 'import':$('#importFile').click();break;
    case 'reload-actions':refreshActionsFromOneDrive();break;
    case 'apply-map':{
      data.settings.actions={dueField:$('#mapDue').value.trim(),titleField:$('#mapTitle').value.trim(),statusField:$('#mapStatus').value.trim()};
      commit();
      try{
        if(ONEDRIVE_ACTIONS_PATH) await refreshActionsFromOneDrive();
        else toast('Saved. Set ONEDRIVE_ACTIONS_PATH in the file to use these names.');
      }catch(err){actionsState.error=err.message;renderData();}
      break;
    }
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='selMonth'){view.m=+t.value;if(view.mode==='fortnight')view.start=mondayOf(fmtDate(view.y,view.m,1));render();}
  else if(t.id==='selYear'){const y=parseInt(t.value);if(y>=1970&&y<=2100){view.y=y;if(view.mode==='fortnight')view.start=mondayOf(fmtDate(view.y,view.m,1));render();}}
  else if(t.id==='dayNote'){render();}
  else if(t.id==='f_repeat'||t.id==='f_interval'){syncRepeatUI();}
  else if(t.id==='f_checkInDate'&&$('#editor').dataset.type==='stay'){const e=$('#f_checkOutDate');if(e&&t.value&&(!e.value||e.value<=t.value))e.value=fromDayNum(dayNum(t.value)+1);}
  else if(t.id==='f_date'&&$('#editor').dataset.type==='holiday'){const e=$('#f_endDate');if(e&&(!e.value||e.value<t.value))e.value=t.value;}
  else if((t.id==='f_kind'||t.id==='f_date'||t.id==='f_noYear')&&$('#editor').dataset.type==='special'){syncSpecialUI();}
  else if(t.dataset&&t.dataset.filter){
    const k=t.dataset.filter; if(t.checked) delete filters[k]; else filters[k]=false;
    saveFilters(); render(); const el=$(`[data-filter="${k}"]`); if(el) el.focus();
  }
  else if(t.id==='imgFile'&&t.files.length){addImageFiles([...t.files]);t.value='';}
  else if(t.id==='importFile'&&t.files[0]){t.files[0].text().then(importJsonText);t.value='';}
});
document.addEventListener('input',e=>{
  if(e.target.id==='dayNote'){const v=e.target.value;if(v.trim())data.dayNotes[selected]=v;else delete data.dayNotes[selected];commit();}
  else if(e.target.id==='f_interval') syncRepeatUI();
  else if(e.target.id==='f_location') syncMapLink();
});
/* pasted or dropped images in the work event editor */
document.addEventListener('paste',e=>{
  const ed=$('#editor'); if(!ed.open||ed.dataset.type!=='work'||!e.clipboardData) return;
  const items=[...e.clipboardData.items];
  const imgs=items.filter(i=>i.kind==='file'&&/^image\//.test(i.type)).map(i=>i.getAsFile()).filter(Boolean);
  if(!imgs.length) return;
  if(!items.some(i=>i.kind==='string'&&i.type==='text/plain')) e.preventDefault();
  addImageFiles(imgs);
});
document.addEventListener('dragover',e=>{const b=e.target.closest&&e.target.closest('#imgBox');if(b){e.preventDefault();b.classList.add('over');}});
document.addEventListener('dragleave',e=>{const b=e.target.closest&&e.target.closest('#imgBox');if(b)b.classList.remove('over');});
document.addEventListener('drop',e=>{
  const b=e.target.closest&&e.target.closest('#imgBox'); if(!b) return;
  e.preventDefault(); b.classList.remove('over');
  const files=[...(e.dataTransfer?e.dataTransfer.files:[])].filter(f=>/^image\//.test(f.type)); if(files.length) addImageFiles(files);
});
/* paint by clicking or dragging across days */
let painting=false,lastPainted=null;
let markSet=true;
function applyPaint(ds){
  if(!ds||ds===lastPainted) return; lastPainted=ds;
  const cell=$(`.day[data-date="${ds}"]`);
  if(MARKERS[paint]){
    const f=data[MARKERS[paint].field];
    if(markSet) f[ds]=true; else delete f[ds];
    const dn=cell&&$('.dn',cell);
    if(dn){$$('.bi',dn).forEach(x=>x.remove());dn.insertAdjacentHTML('beforeend',markIcons(ds));}
    return;
  }
  setDayType(ds,paint);
  if(!cell) return;
  [...cell.classList].filter(c=>c.startsWith('dt-')).forEach(c=>cell.classList.remove(c));
  const dt=dayType(ds); if(dt) cell.classList.add('dt-'+dt);
  const l=$('.dtl',cell); if(l) l.textContent=dt?DTMAP[dt].short:'';
}
document.addEventListener('pointerdown',e=>{
  if(!paint) return; const c=e.target.closest('.day'); if(!c) return;
  if(MARKERS[paint]) markSet=!data[MARKERS[paint].field][c.dataset.date];
  painting=true; lastPainted=null; applyPaint(c.dataset.date); e.preventDefault();
});
document.addEventListener('pointermove',e=>{
  if(!painting) return; const el=document.elementFromPoint(e.clientX,e.clientY), c=el&&el.closest('.day'); if(c) applyPaint(c.dataset.date);
});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{if(painting){painting=false;commit();render();}}));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&paint){paint=null;render();return;}
  if(document.querySelector('dialog[open]')||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if(e.key==='PageUp'){shiftPeriod(-1);e.preventDefault();}
  else if(e.key==='PageDown'){shiftPeriod(1);e.preventDefault();}
  else if(e.key==='t'){goToDate(todayStr());render();}
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){ if(msalAccount){syncFromOneDrive(); if(ONEDRIVE_ACTIONS_PATH) refreshActionsFromOneDrive();} refreshPhoneQueue(); }
});

/* ---------- start ---------- */
(async function init(){
  try{const c=localStorage.getItem(LS_KEY);if(c){data=normalise(JSON.parse(c));if(data._m){delete data._m;cacheLocal();}}}catch(e){}
  try{dirty=localStorage.getItem(LS_DIRTY)==='1';}catch(e){}
  try{filters=JSON.parse(localStorage.getItem(LS_FILTERS)||'{}')||{};}catch(e){filters={};}
  loadActionsCache();
  render();
  refreshPhoneQueue();
  setInterval(refreshPhoneQueue,5*60*1000);
  if(MSAL_CONFIGURED&&window.msal){
    try{
      msalApp=new msal.PublicClientApplication({
        auth:{clientId:GRAPH_CLIENT_ID,authority:'https://login.microsoftonline.com/consumers',redirectUri:window.location.origin+window.location.pathname},
        cache:{cacheLocation:'localStorage'}
      });
      await msalApp.initialize();
      await msalApp.handleRedirectPromise().catch(()=>{});
      const accts=msalApp.getAllAccounts();
      if(accts.length){msalAccount=accts[0]; await syncFromOneDrive(); if(ONEDRIVE_ACTIONS_PATH) await refreshActionsFromOneDrive();}
      else setStatus('local');
    }catch(e){console.error(e);setStatus('local');}
  }else setStatus('local');
  renderPill();
})();
</script>
