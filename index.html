<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#123832">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diary">
<meta name="description" content="A private daily diary — notes, feelings and activities, synced to OneDrive.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<title>Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js" defer></script>
<style>
:root{
  --bg:#e8edeb; --surface:#f7f9f8; --raised:#ffffff;
  --ink:#17231f; --muted:#576661; --faint:#87958f;
  --line:#cfd8d4; --hover:#dbe4e0; --mark:#f6e7a6;
  --accent:#1c6a65; --accent-ink:#ffffff;
  --notes:#3e5060; --pos:#2a7a4a; --neg:#a5423a; --act:#2b5d8d; --ug:#c62828;
  --ok:#2a7a4a; --warn:#b06a00; --warn-t:#f9ecd2; --danger:#b3261e;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1513; --surface:#151e1b; --raised:#1a2521;
    --ink:#e4ece8; --muted:#9aa8a2; --faint:#6b7873;
    --line:#2a3833; --hover:#22302b; --mark:#5a4d12;
    --accent:#62c2b9; --accent-ink:#052220;
    --notes:#aabdcc; --pos:#7bd39c; --neg:#f0948c; --act:#90bce7; --ug:#ff6b60;
    --ok:#7bd39c; --warn:#f0b85a; --warn-t:#3a2c0e; --danger:#ff8a80;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);
  padding-top:var(--safe-t);padding-bottom:var(--safe-b)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:absolute;left:10px;top:calc(-100% - var(--safe-t));background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:8px;z-index:50;transition:top .15s}
.skip-link:focus{top:calc(var(--safe-t) + 10px)}

/* Top bar: sign-in / sync status */
.bar{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:calc(var(--safe-t) + 8px) 20px 8px;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.bar-dot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none}
.bar-dot.is-ok{background:var(--ok)}
.bar-dot.is-warn{background:var(--warn)}
.bar-dot.is-err{background:var(--danger)}
.bar-actions{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--raised);border-radius:7px;padding:8px 14px;font-size:13px;cursor:pointer;line-height:1.4;min-height:38px}
.btn:hover{background:var(--hover)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn-primary:hover{filter:brightness(1.08)}
.notice{max-width:1120px;margin:14px auto 0;padding:10px 14px;border-radius:8px;background:var(--warn-t);color:var(--ink);font-size:13.5px;border:1px solid var(--line);width:calc(100% - 40px)}

/* Sign-in screen */
.gate{max-width:420px;margin:14vh auto 0;padding:0 20px;text-align:center}
.gate h1{font-family:var(--serif);font-weight:500;font-size:28px;margin:0 0 8px}
.gate p{color:var(--muted);margin:0 0 22px}

/* Layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;max-width:1120px;margin:20px auto 48px;padding:0 20px;align-items:start}
.page{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:26px 32px 12px}
.side{position:sticky;top:64px}

/* Day header */
.day-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.day-title{margin:0;font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.15;letter-spacing:-.01em}
.day-rel{margin:4px 0 0;color:var(--muted);font-size:14px}
.day-nav{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.nav-btn{border:1px solid var(--line);background:var(--raised);border-radius:7px;min-width:40px;height:40px;padding:0 10px;cursor:pointer;font-size:14px}
.nav-btn:hover{background:var(--hover)}
.nav-date{border:1px solid var(--line);background:var(--raised);border-radius:7px;height:40px;padding:0 8px;font-size:13px}

/* Entry sections */
.entry{margin:0 0 22px;padding-left:16px;border-left:3px solid var(--sec)}
.entry-notes{--sec:var(--notes)}
.entry-positive{--sec:var(--pos)}
.entry-negative{--sec:var(--neg)}
.entry-activities{--sec:var(--act)}
.entry-label{display:block;margin-bottom:6px;font-weight:600;font-size:14px;color:var(--sec)}
.entry-text{display:block;width:100%;min-height:112px;resize:vertical;overflow:hidden;border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--raised);font-family:var(--serif);font-size:17px;line-height:1.65}
.entry-text::placeholder{color:var(--faint);font-style:italic}
.entry-text:focus{outline:none;border-color:var(--sec);box-shadow:0 0 0 2px var(--sec)}

/* Sidebar panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-title{font-family:var(--serif);font-size:20px;font-weight:500}
.cal-step{border:0;background:transparent;width:36px;height:36px;border-radius:7px;cursor:pointer;font-size:16px}
.cal-step:hover{background:var(--hover)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{text-align:center;font-size:12px;color:var(--faint);padding-bottom:4px}
.cal-day{position:relative;aspect-ratio:1;border:0;border-radius:8px;background:transparent;font-size:14px;cursor:pointer;padding:0;min-height:36px}
.cal-day:hover{background:var(--hover)}
.cal-day.is-today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cal-day.is-sel{background:var(--accent);color:var(--accent-ink);font-weight:600}
.cal-day.has-entry::after{content:'';position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
.cal-day.is-sel.has-entry::after{background:var(--accent-ink)}
.cal-day .ug-ico{position:absolute;top:2px;right:2px;width:14px;height:14px;color:var(--ug);line-height:0;border-radius:50%}
.cal-day .ug-ico svg{width:100%;height:100%;display:block}
.cal-day.is-sel .ug-ico{background:var(--raised);padding:1px;width:16px;height:16px;top:1px;right:1px}
.res-ug{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-left:6px;color:var(--ug)}
.res-ug svg{width:100%;height:100%;display:block}
.day-ug{display:inline-block;width:26px;height:26px;vertical-align:-3px;margin-left:10px;color:var(--ug)}
.day-ug svg{width:100%;height:100%;display:block}

/* Underground visit */
.entry-ug{--sec:var(--ug)}
.ug-toggle{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;color:var(--sec);cursor:pointer;min-height:32px}
.ug-toggle input{width:20px;height:20px;accent-color:var(--ug);margin:0}
.ug-toggle .ico{width:20px;height:20px;display:inline-block;line-height:0}
.ug-toggle .ico svg{width:100%;height:100%}
.ug-body{margin-top:12px}
.ug-times{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:flex-end;margin-bottom:6px}
.ug-time{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.ug-time-row{display:flex;gap:6px}
.ug-input{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--raised);font-size:15px;min-height:40px;width:100%}
.ug-input:focus{outline:none;border-color:var(--sec);box-shadow:0 0 0 2px var(--sec)}
.ug-time .ug-input{width:auto}
.ug-dur{font-size:13.5px;color:var(--muted);padding-bottom:10px}
.ug-h{margin:18px 0 8px;font-size:13.5px;font-weight:600;color:var(--sec)}
.ug-card{border:1px solid var(--line);border-radius:8px;background:var(--raised);padding:10px;margin-bottom:8px;display:grid;gap:8px}
.ug-card .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ug-card textarea.ug-input{min-height:64px;resize:vertical;font-family:var(--serif);font-size:16px;line-height:1.5}
.ug-card-foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ug-vfl{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.ug-vfl input{width:18px;height:18px;accent-color:var(--ug);margin:0}
.ug-rm{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;padding:6px 8px;border-radius:6px;min-height:32px}
.ug-rm:hover{background:var(--hover);color:var(--danger)}
.ug-add{border:1px dashed var(--ug);background:transparent;color:var(--ug);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13.5px;min-height:38px}
.ug-add:hover{background:var(--hover)}
@media (max-width:520px){.ug-card .row2{grid-template-columns:1fr}}

/* Report */
dialog#repDlg{width:min(860px,96vw);max-height:92vh;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:20px 22px;overflow:auto}
dialog#repDlg::backdrop{background:rgba(0,0,0,.45)}
.rep-head,.rep-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rep-head h2{margin:0;font-family:var(--serif);font-weight:500;font-size:26px}
.rep-ctl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;margin:14px 0;font-size:13px;color:var(--muted)}
.rep-ctl label{display:flex;flex-direction:column;gap:4px}
.rep-ctl .rep-chk{flex-direction:row;align-items:center;gap:8px;min-height:40px;color:var(--ink)}
.rep-chk input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.rep-out{border-top:1px solid var(--line);padding:14px 0;margin-bottom:12px}
.rep-out h3{margin:18px 0 8px;font-size:14px;color:var(--ug)}
.rep-out h3:first-child{margin-top:0}
.rep-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.rep-stat{border:1px solid var(--line);border-radius:8px;background:var(--raised);padding:10px 12px}
.rep-stat b{display:block;font-family:var(--serif);font-size:26px;font-weight:500;line-height:1.2}
.rep-stat span{font-size:12.5px;color:var(--muted)}
.rep-tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.rep-tbl th,.rep-tbl td{text-align:left;vertical-align:top;padding:6px 8px;border-bottom:1px solid var(--line)}
.rep-tbl td{white-space:pre-wrap}
.rep-tbl th{font-size:12px;color:var(--muted);font-weight:600}
.rep-note{font-family:var(--serif);font-size:15px;margin:2px 0 10px;white-space:pre-wrap}
.rep-empty{color:var(--muted);font-style:italic;margin:4px 0}
.rep-yes{color:var(--ok);font-weight:600}.rep-no{color:var(--muted)}
@media print{
  body.rp .bar,body.rp .layout,body.rp .notice,body.rp .gate,body.rp .toast,body.rp .skip-link,body.rp .rep-ctl,body.rp .rep-foot,body.rp #repClose{display:none!important}
  body.rp dialog#repDlg{position:static;width:auto;max-height:none;border:0;padding:0;background:#fff;color:#000;overflow:visible}
  body.rp .rep-stat,body.rp .ug-input{background:#fff}
}
.cal-foot{margin:10px 0 0;font-size:12.5px;color:var(--muted)}
.find-input{width:100%;border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:10px;font-size:14px;min-height:40px}
.find-title{margin:14px 0 6px;font-size:13px;color:var(--muted)}
.res{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:8px 10px;cursor:pointer}
.res:hover{background:var(--hover)}
.res.is-sel{background:var(--hover)}
.res-date{display:block;font-size:14px;font-weight:500}
.res-snip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;color:var(--muted)}
.res-snip mark{background:var(--mark);color:inherit;border-radius:2px}

.toast{position:fixed;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw}
.toast.is-on{opacity:1}

@media (max-width:860px){
  .layout{grid-template-columns:1fr;margin-top:14px}
  .side{position:static}
  .page{padding:20px 18px 6px}
  .day-title{font-size:28px}
  .bar{padding-left:14px;padding-right:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .bar,.side,.day-nav,.notice{display:none!important}
  .layout{display:block;margin:0;padding:0}
  .page{border:0;padding:0;background:#fff}
  body{background:#fff;color:#000}
}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to today's entry</a>

<header class="bar">
  <div class="bar-status"><span class="bar-dot" id="barDot" role="status" aria-live="polite"></span><span id="barText">Loading&hellip;</span></div>
  <div class="bar-actions">
    <button class="btn" id="btnReport" type="button" hidden>Report</button>
    <button class="btn" id="btnSignOut" type="button" hidden>Sign out</button>
  </div>
</header>
<div class="notice" id="notice" hidden></div>

<section class="gate" id="gate" hidden>
  <h1>Your diary</h1>
  <p id="gateMsg">Sign in with your Microsoft account to open your diary. Your entries are kept as a file in your own OneDrive &ndash; nothing is stored anywhere else.</p>
  <button class="btn btn-primary" id="btnSignIn" type="button">Sign in with Microsoft</button>
</section>

<main class="layout" id="main" hidden>
  <article class="page">
    <div class="day-head">
      <div>
        <h1 class="day-title" id="dayTitle"></h1>
        <p class="day-rel" id="dayRel"></p>
      </div>
      <div class="day-nav">
        <button class="nav-btn" id="btnPrev" type="button" aria-label="Previous day">&#8249;</button>
        <button class="nav-btn" id="btnToday" type="button">Today</button>
        <button class="nav-btn" id="btnNext" type="button" aria-label="Next day">&#8250;</button>
        <input class="nav-date" id="datePick" type="date" aria-label="Jump to date">
        <button class="nav-btn" id="btnCopy" type="button" title="Copy this day so you can paste it into a OneNote page">Copy for OneNote</button>
      </div>
    </div>
    <div id="sections"></div>
  </article>

  <aside class="side">
    <section class="panel" aria-label="Calendar">
      <div class="cal-head">
        <button class="cal-step" id="calPrev" type="button" aria-label="Previous month">&#8249;</button>
        <span class="cal-title" id="calTitle"></span>
        <button class="cal-step" id="calNext" type="button" aria-label="Next month">&#8250;</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <p class="cal-foot" id="calFoot"></p>
    </section>
    <section class="panel" aria-label="Search">
      <label class="sr-only" for="search">Search all entries</label>
      <input class="find-input" id="search" type="search" placeholder="Search all entries">
      <p class="find-title" id="resultsTitle"></p>
      <div id="results"></div>
    </section>
  </aside>
</main>

<dialog id="repDlg" aria-labelledby="repTitle">
  <div class="rep-head">
    <h2 id="repTitle">Report</h2>
    <button class="btn" id="repClose" type="button">Close</button>
  </div>
  <div class="rep-ctl">
    <label>Period
      <select class="ug-input" id="repPreset">
        <option value="7">Last 7 days</option>
        <option value="30">Last 30 days</option>
        <option value="thisweek">This week (Mon&ndash;Sun)</option>
        <option value="lastweek">Last week</option>
        <option value="thismonth">This month</option>
        <option value="lastmonth">Last month</option>
        <option value="custom">Custom dates</option>
      </select>
    </label>
    <label>From <input class="ug-input" type="date" id="repFrom"></label>
    <label>To <input class="ug-input" type="date" id="repTo"></label>
    <label class="rep-chk"><input type="checkbox" id="repNotes"> Include diary notes</label>
  </div>
  <div id="repOut" class="rep-out"></div>
  <div class="rep-foot">
    <button class="btn" id="repCopy" type="button">Copy for OneNote</button>
    <button class="btn btn-primary" id="repPrint" type="button">Print / save as PDF</button>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* =====================================================================
   CONFIG \u2013 fill these in from your Azure app registration, then upload
===================================================================== */
var CONFIG={
  clientId:'03306c5b-4783-4e53-bf60-dc29e6598229',
  authority:'https://login.microsoftonline.com/consumers',
  redirectUri:window.location.origin+window.location.pathname,
  // Path inside your OneDrive, relative to its root (no leading slash)
  dataPath:'marc.kirsten/Browser Tools/Diary/diary-data.json'
};
/* ===================================================================== */

var FIELDS=[
  {id:'notes',label:'General notes',hint:'What happened today? Anything worth remembering.'},
  {id:'positive',label:'Positive feelings',hint:'What felt good or went well?'},
  {id:'negative',label:'Negative feelings',hint:'What was hard, frustrating or worrying?'},
  {id:'activities',label:'Activities',hint:'What did you do today? One per line works well.'}
];
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var MON_SHORT=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var DAYS_SHORT=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var KEYRE=/^\d{4}-\d{2}-\d{2}$/;
var CACHE='diary-cache-v1';
var SCOPES=['Files.ReadWrite'];

function $(id){return document.getElementById(id);}
function pad(n){return String(n).padStart(2,'0');}
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseKey(k){var p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function longDate(k){var d=parseKey(k);return DAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear();}
function shortDate(k){var d=parseKey(k);return DAYS_SHORT[d.getDay()]+' '+d.getDate()+' '+MON_SHORT[d.getMonth()]+' '+d.getFullYear();}
function addDays(k,n){var d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d);}
function relLabel(k){
  var diff=Math.round((parseKey(k)-parseKey(keyOf(new Date())))/86400000);
  if(diff===0)return 'Today';
  if(diff===-1)return 'Yesterday';
  if(diff===1)return 'Tomorrow';
  return diff<0?(-diff)+' days ago':'In '+diff+' days';
}
/* Crossed pick and shovel (mining logo), drawn in currentColor */
var UG_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  +'<line x1="4" y1="20.5" x2="17.5" y2="7"/><path d="M11.5 4.5Q19 3.5 20.5 11.5"/>'
  +'<line x1="20" y1="20.5" x2="8" y2="8.5"/><path d="M9.5 9.5L3 7L6.5 3.2Z" fill="currentColor"/></svg>';
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function blankUg(){return {on:false,timeIn:'',timeOut:'',areas:[],convos:[]};}
function normTime(s){s=String(s||'');return /^\d{2}:\d{2}$/.test(s)?s:'';}
function normUg(x){
  var u=blankUg();
  if(!x||typeof x!=='object')return u;
  u.on=!!x.on;u.timeIn=normTime(x.timeIn);u.timeOut=normTime(x.timeOut);
  if(Array.isArray(x.areas))u.areas=x.areas.filter(function(a){return a&&typeof a==='object';}).map(function(a){
    return {id:String(a.id||uid()),name:String(a.name||''),notes:String(a.notes||'')};});
  if(Array.isArray(x.convos))u.convos=x.convos.filter(function(c){return c&&typeof c==='object';}).map(function(c){
    return {id:String(c.id||uid()),who:String(c.who||''),location:String(c.location||''),notes:String(c.notes||''),vfl:!!c.vfl};});
  return u;
}
function blank(){return {notes:'',positive:'',negative:'',activities:'',ug:blankUg(),updated:''};}
function normEntry(x){
  var e=blank();
  FIELDS.forEach(function(f){e[f.id]=String((x&&x[f.id])||'');});
  e.ug=normUg(x&&x.ug);
  e.updated=String((x&&x.updated)||'');
  return e;
}
function ugActive(e){return !!e&&!!e.ug&&e.ug.on;}
function hasContent(e){return !!e&&(ugActive(e)||FIELDS.some(function(f){return e[f.id].trim()!=='';}));}
/* every searchable string of an entry, text fields first */
function sources(e){
  var out=FIELDS.map(function(f){return e[f.id];});
  if(ugActive(e)){
    e.ug.areas.forEach(function(a){out.push(a.name,a.notes);});
    e.ug.convos.forEach(function(c){out.push(c.who,c.location,c.notes);});
  }
  return out;
}
function fmtTime(t){
  if(!t)return '';var p=t.split(':').map(Number),h=p[0]%12||12;
  return h+':'+pad(p[1])+(p[0]<12?' am':' pm');
}
function durText(u){
  if(!u.timeIn||!u.timeOut)return '';
  var a=u.timeIn.split(':').map(Number),b=u.timeOut.split(':').map(Number);
  var mins=(b[0]*60+b[1])-(a[0]*60+a[1]);if(mins<0)mins+=1440;
  var h=Math.floor(mins/60),m=mins%60;
  return (h?h+' h ':'')+m+' min underground';
}
function ugText(e){
  var u=e.ug,L=['Underground visit'];
  if(u.timeIn||u.timeOut)L.push('Time in '+(fmtTime(u.timeIn)||'-')+', time out '+(fmtTime(u.timeOut)||'-')+(durText(u)?' ('+durText(u)+')':''));
  if(u.areas.length){L.push('','Panels / areas visited');u.areas.forEach(function(a){L.push('- '+(a.name.trim()||'(unnamed)')+(a.notes.trim()?': '+a.notes.trim():''));});}
  if(u.convos.length){L.push('','Conversations');u.convos.forEach(function(c){
    L.push('- '+(c.who.trim()||'(unnamed)')+(c.location.trim()?' @ '+c.location.trim():'')+' [VFL '+(c.vfl?'completed':'not completed')+']'+(c.notes.trim()?': '+c.notes.trim():''));});}
  return L.join('\n');
}
function timeStr(d){return d.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'});}

/* ---------- State ---------- */
var state={
  entries:{},
  selected:keyOf(new Date()),
  view:null,
  account:null,
  ready:false,
  dirty:false,saving:false,again:false,err:'',
  lastSaved:null,search:''
};
(function(){var d=parseKey(state.selected);state.view={y:d.getFullYear(),m:d.getMonth()};})();
var saveTimer=null,sideTimer=null,toastTimer=null,msalApp=null;

/* ---------- Local cache (instant load / offline fallback) ---------- */
function cacheSave(){try{localStorage.setItem(CACHE,JSON.stringify(state.entries));}catch(e){}}
function cacheLoad(){
  try{
    var t=localStorage.getItem(CACHE);
    if(!t)return;
    var o=JSON.parse(t);
    Object.keys(o).forEach(function(k){if(KEYRE.test(k))state.entries[k]=normEntry(o[k]);});
  }catch(e){}
}

/* ---------- Data merge and serialisation ---------- */
function mergeIn(data){
  var src=data&&data.entries;
  if(!src||typeof src!=='object')throw new Error('That file is not diary data.');
  var n=0;
  Object.keys(src).forEach(function(k){
    if(!KEYRE.test(k)||!src[k]||typeof src[k]!=='object')return;
    var inc=normEntry(src[k]),cur=state.entries[k];
    if(!cur||inc.updated>cur.updated){state.entries[k]=inc;n++;}
  });
  return n;
}
function serialize(){
  var out={};
  Object.keys(state.entries).sort().forEach(function(k){out[k]=state.entries[k];});
  return {app:'diary',version:1,saved:new Date().toISOString(),entries:out};
}

function fillSnippet(node,e,q){
  var text='',idx=-1,i,src=sources(e);
  if(q){
    for(i=0;i<src.length;i++){
      var at=src[i].toLowerCase().indexOf(q);
      if(at>=0){text=src[i];idx=at;break;}
    }
  }
  if(!text){
    for(i=0;i<src.length;i++){if(src[i].trim()){text=src[i];break;}}
  }
  if(!text&&ugActive(e)){text='Underground visit'+(e.ug.timeIn?' from '+fmtTime(e.ug.timeIn):'')+(e.ug.timeOut?' to '+fmtTime(e.ug.timeOut):'');}
  var start=idx>40?idx-40:0;
  var piece=text.slice(start,start+120).replace(/\s+/g,' ').trim();
  if(start>0)piece='\u2026'+piece;
  if(text.length>start+120)piece+='\u2026';
  if(q){
    var li=piece.toLowerCase().indexOf(q);
    if(li>=0){
      node.appendChild(document.createTextNode(piece.slice(0,li)));
      var mk=document.createElement('mark');mk.textContent=piece.slice(li,li+q.length);
      node.appendChild(mk);
      node.appendChild(document.createTextNode(piece.slice(li+q.length)));
      return;
    }
  }
  node.textContent=piece;
}

/* ---------- Auth ---------- */
function initMsal(){
  msalApp=new msal.PublicClientApplication({
    auth:{clientId:CONFIG.clientId,authority:CONFIG.authority,redirectUri:CONFIG.redirectUri},
    cache:{cacheLocation:'localStorage',storeAuthStateInCookie:false}
  });
}
async function getToken(interactive){
  var accts=msalApp.getAllAccounts();
  var account=accts[0];
  if(account){
    try{
      var r=await msalApp.acquireTokenSilent({scopes:SCOPES,account:account});
      state.account=r.account;
      return r.accessToken;
    }catch(e){ /* fall through to interactive */ }
  }
  if(!interactive)return null;
  var r2=await msalApp.acquireTokenPopup({scopes:SCOPES});
  state.account=r2.account;
  return r2.accessToken;
}
async function signIn(){
  $('btnSignIn').disabled=true;
  try{
    await getToken(true);
    $('gate').hidden=true;
    $('btnSignOut').hidden=false;$('btnReport').hidden=false;
    $('main').hidden=false;
    await afterSignIn();
  }catch(e){
    $('gateMsg').textContent=(e&&e.message)?e.message:'Sign-in failed. Please try again.';
  }finally{
    $('btnSignIn').disabled=false;
  }
}
function signOut(){
  var account=state.account;
  msalApp.logoutRedirect({account:account,postLogoutRedirectUri:CONFIG.redirectUri});
}

/* ---------- Graph read/write ---------- */
function graphUrl(){
  var parts=CONFIG.dataPath.split('/').filter(Boolean).map(encodeURIComponent).join('/');
  return 'https://graph.microsoft.com/v1.0/me/drive/root:/'+parts+':/content';
}
async function graphGet(){
  var token=await getToken(true);
  var res=await fetch(graphUrl(),{headers:{Authorization:'Bearer '+token}});
  if(res.status===404)return null;
  if(!res.ok)throw new Error('Could not reach OneDrive (HTTP '+res.status+').');
  return res.json();
}
async function graphPut(obj){
  var token=await getToken(true);
  var res=await fetch(graphUrl(),{
    method:'PUT',
    headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
    body:JSON.stringify(obj,null,2)
  });
  if(!res.ok)throw new Error('Could not save to OneDrive (HTTP '+res.status+').');
}

async function afterSignIn(){
  buildSections();
  cacheLoad();
  renderAll();
  updateBar();
  try{
    var data=await graphGet();
    if(data){mergeIn(data);cacheSave();renderAll();}
    else{await graphPut(serialize());}
    state.lastSaved=new Date();
    state.err='';
  }catch(e){
    state.err=(e&&e.message)||String(e);
  }
  state.ready=true;
  updateBar();
  setInterval(function(){if(state.dirty)flush();},30000);
}

/* ---------- Saving ---------- */
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(flush,1200);}
async function flush(){
  clearTimeout(saveTimer);
  cacheSave();
  if(!state.dirty||state.saving){if(state.dirty)state.again=true;return;}
  state.saving=true;state.err='';updateBar();
  try{
    await graphPut(serialize());
    state.dirty=false;
    state.lastSaved=new Date();
  }catch(e){
    state.err=(e&&e.message)||String(e);
  }finally{
    state.saving=false;
    updateBar();
    if(state.again){state.again=false;if(state.dirty)flush();}
  }
}

function onEdit(field,ta){
  var k=state.selected;
  var e=state.entries[k];
  if(!e){e=blank();state.entries[k]=e;}
  e[field]=ta.value;
  e.updated=new Date().toISOString();
  state.dirty=true;state.err='';
  autosize(ta);
  cacheSave();updateBar();scheduleSave();scheduleSide();
}

/* ---------- Report over a period ---------- */
var repText='';
function mondayOf(k){var d=parseKey(k);return addDays(k,-((d.getDay()+6)%7));}
function setPreset(){
  var p=$('repPreset').value,t=keyOf(new Date()),f,e=t,d=parseKey(t);
  if(p==='custom')return;
  if(p==='7')f=addDays(t,-6);
  else if(p==='30')f=addDays(t,-29);
  else if(p==='thisweek'){f=mondayOf(t);e=addDays(f,6);}
  else if(p==='lastweek'){f=addDays(mondayOf(t),-7);e=addDays(f,6);}
  else if(p==='thismonth'){f=keyOf(new Date(d.getFullYear(),d.getMonth(),1));e=keyOf(new Date(d.getFullYear(),d.getMonth()+1,0));}
  else{f=keyOf(new Date(d.getFullYear(),d.getMonth()-1,1));e=keyOf(new Date(d.getFullYear(),d.getMonth(),0));}
  $('repFrom').value=f;$('repTo').value=e;
}
function durMins(u){
  if(!u.timeIn||!u.timeOut)return null;
  var a=u.timeIn.split(':').map(Number),b=u.timeOut.split(':').map(Number),m=(b[0]*60+b[1])-(a[0]*60+a[1]);
  return m<0?m+1440:m;
}
function hm(m){var h=Math.floor(m/60);return (h?h+' h ':'')+(m%60)+' min';}
function buildReport(){
  var from=$('repFrom').value,to=$('repTo').value;
  if(!KEYRE.test(from)||!KEYRE.test(to))return null;
  if(from>to){var s=from;from=to;to=s;}
  var withNotes=$('repNotes').checked;
  var keys=Object.keys(state.entries).filter(function(k){return k>=from&&k<=to&&hasContent(state.entries[k]);}).sort();
  var r={from:from,to:to,days:keys.length,visits:[],mins:0,timed:0,convos:[],vfl:0,areas:{},notes:[]};
  keys.forEach(function(k){
    var e=state.entries[k];
    if(withNotes){
      var parts=FIELDS.filter(function(f){return e[f.id].trim();}).map(function(f){return {label:f.label,text:e[f.id].trim()};});
      if(parts.length)r.notes.push({key:k,parts:parts});
    }
    if(!ugActive(e))return;
    var u=e.ug,m=durMins(u);
    r.visits.push({key:k,timeIn:u.timeIn,timeOut:u.timeOut,mins:m,areas:u.areas.length,convos:u.convos.length});
    if(m!==null){r.mins+=m;r.timed++;}
    u.areas.forEach(function(a){
      var n=a.name.trim()||'(unnamed)',id=n.toLowerCase(),o=r.areas[id]||(r.areas[id]={name:n,count:0,notes:[]});
      o.count++;if(a.notes.trim())o.notes.push({key:k,text:a.notes.trim()});
    });
    u.convos.forEach(function(c){r.convos.push({key:k,who:c.who.trim(),location:c.location.trim(),notes:c.notes.trim(),vfl:c.vfl});if(c.vfl)r.vfl++;});
  });
  return r;
}
function reportPlain(r){
  var L=['Diary report: '+shortDate(r.from)+' to '+shortDate(r.to),'',
    'Days with entries: '+r.days,'Underground visits: '+r.visits.length];
  if(r.timed)L.push('Time underground: '+hm(r.mins)+' (average '+hm(Math.round(r.mins/r.timed))+' per timed visit)');
  L.push('Conversations: '+r.convos.length,'VFLs completed: '+r.vfl);
  if(r.visits.length){L.push('','Underground visits');r.visits.forEach(function(v){
    L.push('- '+shortDate(v.key)+': '+(fmtTime(v.timeIn)||'-')+' to '+(fmtTime(v.timeOut)||'-')+(v.mins!==null?' ('+hm(v.mins)+')':'')+', '+v.areas+' area(s), '+v.convos+' conversation(s)');});}
  var al=Object.keys(r.areas).map(function(i){return r.areas[i];}).sort(function(a,b){return b.count-a.count||a.name.localeCompare(b.name);});
  if(al.length){L.push('','Panels / areas visited');al.forEach(function(a){
    L.push('- '+a.name+' ('+a.count+(a.count===1?' visit':' visits')+')');a.notes.forEach(function(n){L.push('    '+shortDate(n.key)+': '+n.text);});});}
  if(r.convos.length){L.push('','Conversations');r.convos.forEach(function(c){
    L.push('- '+shortDate(c.key)+': '+(c.who||'(unnamed)')+(c.location?' @ '+c.location:'')+' [VFL '+(c.vfl?'completed':'not completed')+']'+(c.notes?': '+c.notes:''));});}
  if(r.notes.length){L.push('','Diary notes');r.notes.forEach(function(n){L.push('',shortDate(n.key));n.parts.forEach(function(p){L.push(p.label+': '+p.text);});});}
  return L.join('\n');
}
function el(tag,cls,txt){var x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x;}
function table(heads,rows){
  var t=el('table','rep-tbl'),h=el('tr');
  heads.forEach(function(x){h.appendChild(el('th','',x));});t.appendChild(el('thead')).appendChild(h);
  var tb=el('tbody');rows.forEach(function(row){var tr=el('tr');row.forEach(function(c){
    var td=el('td');if(c&&c.cls){td.className=c.cls;td.textContent=c.t;}else td.textContent=c;tr.appendChild(td);});tb.appendChild(tr);});
  t.appendChild(tb);return t;
}
function renderReport(){
  var out=$('repOut');out.textContent='';repText='';
  var r=buildReport();
  if(!r){out.appendChild(el('p','rep-empty','Choose a from and to date.'));return;}
  repText=reportPlain(r);
  out.appendChild(el('h3','',shortDate(r.from)+' to '+shortDate(r.to)));
  var st=el('div','rep-stats');
  [[r.days,'days with entries'],[r.visits.length,'underground visits'],[r.timed?hm(r.mins):'-','time underground'],
   [r.convos.length,'conversations'],[r.vfl+' of '+r.convos.length,'VFLs completed']].forEach(function(s){
    var b=el('div','rep-stat');b.appendChild(el('b','',String(s[0])));b.appendChild(el('span','',s[1]));st.appendChild(b);});
  out.appendChild(st);
  out.appendChild(el('h3','','Underground visits'));
  if(!r.visits.length)out.appendChild(el('p','rep-empty','No underground visits in this period.'));
  else out.appendChild(table(['Date','In','Out','Duration','Areas','Conversations'],r.visits.map(function(v){
    return [shortDate(v.key),fmtTime(v.timeIn)||'-',fmtTime(v.timeOut)||'-',v.mins!==null?hm(v.mins):'-',String(v.areas),String(v.convos)];})));
  var al=Object.keys(r.areas).map(function(i){return r.areas[i];}).sort(function(a,b){return b.count-a.count||a.name.localeCompare(b.name);});
  if(al.length){
    out.appendChild(el('h3','','Panels / areas visited'));
    out.appendChild(table(['Panel / area','Visits','Notes'],al.map(function(a){
      return [a.name,String(a.count),a.notes.map(function(n){return shortDate(n.key)+': '+n.text;}).join('\n')];})));
  }
  if(r.convos.length){
    out.appendChild(el('h3','','Conversations'));
    out.appendChild(table(['Date','With','Location','VFL','Notes'],r.convos.map(function(c){
      return [shortDate(c.key),c.who||'(unnamed)',c.location||'-',{t:c.vfl?'Completed':'Not completed',cls:c.vfl?'rep-yes':'rep-no'},c.notes||'-'];})));
  }
  if(r.notes.length){
    out.appendChild(el('h3','','Diary notes'));
    r.notes.forEach(function(n){
      out.appendChild(el('strong','',shortDate(n.key)));
      n.parts.forEach(function(p){out.appendChild(el('div','rep-note',p.label+': '+p.text));});
    });
  }
}
function openReport(){
  if(!$('repFrom').value)setPreset();
  renderReport();
  if(!$('repDlg').open)$('repDlg').showModal();
}
async function copyReport(){
  if(!repText){toast('Nothing to copy');return;}
  try{await navigator.clipboard.writeText(repText);toast('Copied – paste it into a OneNote page');}
  catch(err){
    var t=document.createElement('textarea');t.value=repText;t.style.position='fixed';t.style.opacity='0';
    document.body.appendChild(t);t.select();var ok=false;
    try{ok=document.execCommand('copy');}catch(x){}
    t.remove();toast(ok?'Copied – paste it into a OneNote page':'Copy was blocked by the browser');
  }
}

/* ---------- Copy for OneNote ---------- */
async function copyDay(){
  var k=state.selected,e=state.entries[k];
  if(!hasContent(e)){toast('Nothing written for this day yet');return;}
  var parts=FIELDS.filter(function(f){return e[f.id].trim();});
  var text=longDate(k)+'\n\n'+parts.map(function(f){return f.label+'\n'+e[f.id].trim();}).join('\n\n');
  if(ugActive(e))text+=(parts.length?'\n\n':'')+ugText(e);
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  var html='<h2>'+esc(longDate(k))+'</h2>'+parts.map(function(f){
    return '<h3>'+esc(f.label)+'</h3><p>'+esc(e[f.id].trim()).replace(/\n/g,'<br>')+'</p>';
  }).join('');
  if(ugActive(e))html+='<h3>Underground visit</h3><p>'+esc(ugText(e).split('\n').slice(1).join('\n')).replace(/\n/g,'<br>')+'</p>';
  try{
    if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){
      await navigator.clipboard.write([new ClipboardItem({
        'text/html':new Blob([html],{type:'text/html'}),
        'text/plain':new Blob([text],{type:'text/plain'})
      })]);
    }else{
      await navigator.clipboard.writeText(text);
    }
    toast('Copied \u2013 paste it into a OneNote page');
  }catch(err){
    var t=document.createElement('textarea');
    t.value=text;t.style.position='fixed';t.style.opacity='0';
    document.body.appendChild(t);t.select();
    var ok=false;
    try{ok=document.execCommand('copy');}catch(x){}
    t.remove();
    toast(ok?'Copied \u2013 paste it into a OneNote page':'Copy was blocked by the browser');
  }
}

function toast(msg){
  var t=$('toast');
  t.textContent=msg;t.classList.add('is-on');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove('is-on');},3200);
}

/* ---------- Navigation ---------- */
function goTo(k){
  if(!KEYRE.test(k))return;
  state.selected=k;
  var d=parseKey(k);
  state.view={y:d.getFullYear(),m:d.getMonth()};
  renderAll();
}
function stepMonth(n){
  var d=new Date(state.view.y,state.view.m+n,1);
  state.view={y:d.getFullYear(),m:d.getMonth()};
  renderCal();
}

/* ---------- Wiring ---------- */
function wire(){
  $('btnSignIn').addEventListener('click',signIn);
  $('btnSignOut').addEventListener('click',signOut);
  $('btnReport').addEventListener('click',openReport);
  $('repClose').addEventListener('click',function(){$('repDlg').close();});
  $('repPreset').addEventListener('change',function(){setPreset();renderReport();});
  ['repFrom','repTo'].forEach(function(id){$(id).addEventListener('change',function(){$('repPreset').value='custom';renderReport();});});
  $('repNotes').addEventListener('change',renderReport);
  $('repCopy').addEventListener('click',copyReport);
  $('repPrint').addEventListener('click',function(){
    document.body.classList.add('rp');
    var done=function(){document.body.classList.remove('rp');window.removeEventListener('afterprint',done);};
    window.addEventListener('afterprint',done);window.print();
  });
  $('btnPrev').addEventListener('click',function(){goTo(addDays(state.selected,-1));});
  $('btnNext').addEventListener('click',function(){goTo(addDays(state.selected,1));});
  $('btnToday').addEventListener('click',function(){goTo(keyOf(new Date()));});
  $('datePick').addEventListener('change',function(ev){if(ev.target.value)goTo(ev.target.value);});
  $('btnCopy').addEventListener('click',copyDay);
  $('calPrev').addEventListener('click',function(){stepMonth(-1);});
  $('calNext').addEventListener('click',function(){stepMonth(1);});
  $('calGrid').addEventListener('click',function(ev){var b=ev.target.closest('.cal-day');if(b)goTo(b.dataset.key);});
  $('results').addEventListener('click',function(ev){var b=ev.target.closest('.res');if(b)goTo(b.dataset.key);});
  $('search').addEventListener('input',function(ev){state.search=ev.target.value;renderList();});

  document.addEventListener('keydown',function(ev){
    if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='s'){ev.preventDefault();flush();return;}
    if(document.activeElement===document.body&&!ev.ctrlKey&&!ev.metaKey&&!ev.altKey){
      if(ev.key==='ArrowLeft')goTo(addDays(state.selected,-1));
      else if(ev.key==='ArrowRight')goTo(addDays(state.selected,1));
    }
  });
  document.addEventListener('visibilitychange',function(){if(document.hidden&&state.dirty)flush();});
  window.addEventListener('beforeunload',function(ev){
    if(state.dirty){flush();ev.preventDefault();ev.returnValue='';}
  });
  window.addEventListener('resize',function(){FIELDS.forEach(function(f){var ta=$('f-'+f.id);if(ta)autosize(ta);});});
}

/* ---------- Start ---------- */
function boot(){
  if(!window.msal){setTimeout(boot,50);return;}
  wire();
  initMsal();
  msalApp.initialize().then(function(){
    return msalApp.handleRedirectPromise();
  }).then(function(){
    var accts=msalApp.getAllAccounts();
    if(accts.length){
      state.account=accts[0];
      $('btnSignOut').hidden=false;$('btnReport').hidden=false;
      $('main').hidden=false;
      afterSignIn();
    }else{
      $('gate').hidden=false;
      updateBar();
      $('barText').textContent='Not signed in';
    }
  }).catch(function(e){
    $('gate').hidden=false;
    $('gateMsg').textContent=(e&&e.message)||'Sign-in failed. Please try again.';
  });
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();

if(CONFIG.clientId.indexOf('PASTE-YOUR')===0){
  window.addEventListener('load',function(){
    var n=$('notice');
    n.hidden=false;
    n.textContent='This copy has no Application (client) ID yet \u2013 open index.html and paste yours into CONFIG before uploading.';
  });
}
})();
</script>
